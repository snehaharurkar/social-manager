services:
  - type: web
    name: social-manager-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm --prefix client install --include=dev && npm --prefix client run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
